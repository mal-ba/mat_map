const REPO = 'mal-ba/mat_map';

async function fixAll() {
  const token = document.getElementById('token').value.trim();
  if (!token) { showStatus('토큰을 입력해주세요.', false); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '⏳ 처리 중...';

  let ok = 0, fail = 0;
  for (const [path, b64] of Object.entries(FILES)) {
    try {
      const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
        headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github.v3+json' }
      });
      if (!r.ok) throw new Error(path + ' 조회 실패 ' + r.status);
      const d = await r.json();
      const p = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
        method: 'PUT',
        headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json', Accept: 'application/vnd.github.v3+json' },
        body: JSON.stringify({ message: 'fix: ' + path, content: b64, sha: d.sha })
      });
      if (!p.ok) { const e = await p.json(); throw new Error(e.message); }
      ok++;
    } catch(e) { fail++; console.error(path, e.message); }
  }

  btn.disabled = false; btn.textContent = '▶ 자동 수정 시작';
  showStatus(fail === 0
    ? '✅ ' + ok + '개 수정 완료! Render 배포 시작됩니다.'
    : '⚠️ ' + ok + '개 성공, ' + fail + '개 실패. 토큰 권한(repo) 확인해주세요.', fail === 0);
}

function showStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = ok ? 'ok' : 'err'; el.style.display = 'block';
}
</script>
