<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내 가게 찾기 · 사업자 인증 — 찐맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
.container{max-width:560px;margin:0 auto;padding:28px 16px 60px;}
h1{font-family:'Black Han Sans',sans-serif;font-size:22px;margin:0 0 6px;}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;line-height:1.6;}
.search-row{display:flex;gap:8px;margin-bottom:18px;}
.search-row input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:'Noto Sans KR',sans-serif;}
.search-row input:focus{outline:none;border-color:var(--stamp);}
.search-row button{padding:11px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;white-space:nowrap;}
.place-row{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.place-row h3{margin:0 0 4px;font-size:15px;}
.place-meta{font-size:12px;color:#8A8580;margin-bottom:10px;}
.claim-btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--stamp);background:none;color:var(--stamp);}
.claim-btn:disabled{border-color:#eee;color:#aaa;cursor:not-allowed;background:#f7f7f7;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:6px;}
.badge.pending{background:#fffbeb;color:#b45309;}
.badge.approved{background:#f0fdf4;color:#15803d;}
.empty{text-align:center;color:#aaa;font-size:13px;padding:40px 0;}
.section-title{font-family:'Black Han Sans',sans-serif;font-size:16px;margin:28px 0 12px;}
dialog{border:none;border-radius:14px;padding:0;max-width:400px;width:90%;}
dialog::backdrop{background:rgba(28,25,23,.5);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;}
.field input,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;
  font-size:13px;font-family:'Noto Sans KR',sans-serif;}
.field textarea{resize:vertical;min-height:60px;}
.hint{font-size:11px;color:var(--ink-soft);margin-top:12px;line-height:1.5;}
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;color:inherit;">
    <span class="brand-mark">찐</span>
    <div class="brand-text"><strong>찐맛집</strong><span>사람이 찾고, AI가 확인한 진짜 맛집</span></div>
  </a>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="/" class="btn-ghost" style="display:inline-block;text-decoration:none;">🔍 검색으로</a>
    <a href="/boost.html" class="btn-ghost" style="display:inline-block;text-decoration:none;">🚀 끌어올리기</a>
    <div class="auth-area" id="authArea" style="visibility:hidden;"></div>
  </div>
</header>

<div class="container">
  <h1>🏪 내 가게 찾기 · 사업자 인증</h1>
  <p class="sub">이미 찐맛집에 등록된 내 가게를 찾아서 사업자 인증을 신청하세요.<br>
    관리자 승인이 완료되면 그 가게로 <a href="/boost.html">끌어올리기</a>를 신청할 수 있어요.</p>

  <div class="search-row">
    <input id="q" type="text" placeholder="가게 이름 또는 주소로 검색" onkeydown="if(event.key==='Enter')search()" />
    <button onclick="search()">검색</button>
  </div>

  <div id="results"></div>

  <div id="myClaimsSection" style="display:none;">
    <div class="section-title">내 인증 신청 현황</div>
    <div id="myClaimsList"></div>
  </div>
</div>

<dialog id="claimDialog">
  <div style="padding:24px;">
    <h3 style="font-family:'Black Han Sans',sans-serif;margin:0 0 4px;" id="dialogPlaceName"></h3>
    <p style="font-size:12px;color:var(--ink-soft);margin:0 0 16px;">사업자 본인 확인을 위한 정보예요. 관리자 검토 후 승인돼요.</p>
    <div class="field">
      <label>연락처 (사업장 전화번호)</label>
      <input id="claimPhone" type="tel" placeholder="010-0000-0000" />
    </div>
    <div class="field">
      <label>사업자등록번호</label>
      <input id="claimBiz" type="text" placeholder="000-00-00000" />
    </div>
    <div class="field">
      <label>추가 메모 (선택)</label>
      <textarea id="claimNote" placeholder="사업자등록증 첨부 대신 확인 가능한 정보를 적어주셔도 돼요"></textarea>
    </div>
    <p id="claimError" style="color:var(--stamp);font-size:12px;margin-bottom:10px;"></p>
    <div style="display:flex;gap:8px;">
      <button class="btn-ghost" onclick="document.getElementById('claimDialog').close()" style="flex:1;">취소</button>
      <button class="btn-primary" id="submitClaimBtn" style="flex:1;">신청하기</button>
    </div>
  </div>
</dialog>

<script>
let claimingPlaceId = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function statusBadge(p) {
  if (p.owner_claim_status === 'approved') return '<span class="badge approved">✅ 인증 완료</span>';
  if (p.owner_claim_status === 'pending') return '<span class="badge pending">⏳ 검토 중</span>';
  return '';
}

async function search() {
  const q = document.getElementById('q').value.trim();
  const results = document.getElementById('results');
  if (!q) { results.innerHTML = ''; return; }

  results.innerHTML = '<p class="empty">검색 중...</p>';
  const res = await fetch(`/api/places/search?q=${encodeURIComponent(q)}`, { credentials: 'include' });
  if (!res.ok) {
    if (res.status === 401) { results.innerHTML = '<p class="empty">로그인 후 이용할 수 있어요. <a href="/login.html">로그인</a></p>'; return; }
    results.innerHTML = '<p class="empty">검색에 실패했어요.</p>';
    return;
  }
  const places = await res.json();
  if (!places.length) { results.innerHTML = '<p class="empty">검색 결과가 없어요. 가게가 아직 등록되지 않았다면 직접 등록해보세요.</p>'; return; }

  results.innerHTML = places.map(p => `
    <div class="place-row">
      <h3>${escapeHtml(p.name)} ${statusBadge(p)}</h3>
      <div class="place-meta">${escapeHtml(p.address)}${p.category ? ' · ' + escapeHtml(p.category) : ''}</div>
      <button class="claim-btn" ${p.owner_claim_status === 'approved' || p.owner_claim_status === 'pending' ? 'disabled' : ''}
        onclick="openClaimDialog('${p.id}', ${JSON.stringify(p.name)})">
        ${p.owner_claim_status === 'approved' ? '인증 완료' : p.owner_claim_status === 'pending' ? '검토 중' : '내 가게 인증 신청'}
      </button>
    </div>
  `).join('');
}

function openClaimDialog(placeId, name) {
  claimingPlaceId = placeId;
  document.getElementById('dialogPlaceName').textContent = name;
  document.getElementById('claimPhone').value = '';
  document.getElementById('claimBiz').value = '';
  document.getElementById('claimNote').value = '';
  document.getElementById('claimError').textContent = '';
  document.getElementById('claimDialog').showModal();
}

document.getElementById('submitClaimBtn').addEventListener('click', async () => {
  const phone = document.getElementById('claimPhone').value.trim();
  const biz_number = document.getElementById('claimBiz').value.trim();
  const note = document.getElementById('claimNote').value.trim();
  const errEl = document.getElementById('claimError');
  if (!phone || !biz_number) { errEl.textContent = '연락처와 사업자등록번호를 입력해주세요.'; return; }

  errEl.textContent = '';
  const res = await fetch(`/api/places/${claimingPlaceId}/claim`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ phone, biz_number, note }),
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || '신청에 실패했어요.'; return; }

  document.getElementById('claimDialog').close();
  search();
  loadMyClaims();
});

async function loadMyClaims() {
  const res = await fetch('/api/places/my-claims', { credentials: 'include' });
  if (!res.ok) return;
  const claims = await res.json();
  const section = document.getElementById('myClaimsSection');
  const list = document.getElementById('myClaimsList');
  if (!claims.length) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  list.innerHTML = claims.map(p => `
    <div class="place-row">
      <h3>${escapeHtml(p.name)} ${statusBadge(p)}</h3>
      <div class="place-meta">${escapeHtml(p.address)}</div>
    </div>
  `).join('');
}

loadMyClaims();
</script>
</body>
</html>
