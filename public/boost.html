<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가게 끌어올리기 — 찐맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<script src="https://js.tosspayments.com/v1/payment-widget"></script>
<style>
.container{max-width:560px;margin:0 auto;padding:28px 16px 60px;}
h1{font-family:'Black Han Sans',sans-serif;font-size:22px;margin:0 0 6px;}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;line-height:1.6;}
.place-row{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.place-row h3{margin:0 0 4px;font-size:15px;}
.place-meta{font-size:12px;color:#8A8580;margin-bottom:10px;}
.boost-btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--stamp);background:var(--stamp);color:#fff;}
.boost-btn:disabled{background:#eee;border-color:#eee;color:#aaa;cursor:not-allowed;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:6px;}
.badge.boosted{background:#fef3c7;color:#b45309;}
.badge.ineligible{background:#f3f2ef;color:#999;}
.empty{text-align:center;color:#aaa;font-size:13px;padding:40px 0;}
dialog{border:none;border-radius:14px;padding:0;max-width:380px;width:90%;}
dialog::backdrop{background:rgba(28,25,23,.5);}
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;color:inherit;">
    <span class="brand-mark">찐</span>
    <div class="brand-text"><strong>찐맛집</strong><span>사람이 찾고, AI가 확인한 진짜 맛집</span></div>
  </a>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="/" class="btn-ghost" style="display:inline-block;text-decoration:none;">🔍 검색으로</a>
    <a href="/map.html" class="btn-ghost" style="display:inline-block;text-decoration:none;">🗺️ 지도</a>
    <div class="auth-area" id="authArea" style="visibility:hidden;"></div>
  </div>
</header>

<div class="container">
  <h1>🚀 가게 끌어올리기</h1>
  <p class="sub">내가 등록한 가게를 7일 동안 목록 맨 위에 노출해요.<br>리뷰가 적은(저매출) 가게만 신청할 수 있어요.</p>
  <div id="placesList"><p class="empty">불러오는 중...</p></div>
</div>

<dialog id="payDialog">
  <div style="padding:24px;">
    <h3 style="font-family:'Black Han Sans',sans-serif;margin:0 0 4px;" id="dialogPlaceName"></h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;" id="dialogPrice"></p>
    <div id="payment-method"></div>
    <div id="agreement" style="margin-top:8px;"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn-ghost" onclick="document.getElementById('payDialog').close()" style="flex:1;">취소</button>
      <button class="btn-primary" id="payBtn" style="flex:1;" disabled>결제하기</button>
    </div>
  </div>
</dialog>

<script>
let config = null;
let paymentWidget = null;
let currentOrder = null;

// 관리자는 역할과 무관하게 끌어올리기 이용 가능
const ADMIN_EMAILS = ['jehoon100703@gmail.com'];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadPlaces() {
  const wrap = document.getElementById('placesList');
  const meRes = await fetch('/api/auth/profile', { credentials: 'include' });
  if (!meRes.ok) { wrap.innerHTML = '<p class="empty">로그인 후 이용할 수 있어요. <a href="/login.html">로그인</a></p>'; return; }
  const me = await meRes.json();
  if (me.role !== 'owner' && !ADMIN_EMAILS.includes(me.email)) {
    wrap.innerHTML = '<p class="empty">🏪 가게 끌어올리기는 <b>사장님 계정</b>만 이용할 수 있어요.<br>고객으로 가입하셨다면 이 기능은 이용하실 수 없어요.</p>';
    return;
  }

  const res = await fetch('/api/places/mine', { credentials: 'include' });
  const places = await res.json();
  const verified = places.filter(p => p.status === 'verified');

  if (!verified.length) { wrap.innerHTML = '<p class="empty">등록해서 검증된 가게가 없어요.</p>'; return; }

  wrap.innerHTML = '';
  for (const p of verified) {
    const el = document.createElement('div');
    el.className = 'place-row';
    const boosted = p.boosted_until && new Date(p.boosted_until) > new Date();
    let badgeHtml = '';
    let btnHtml = '';
    if (boosted) {
      const d = new Date(p.boosted_until);
      badgeHtml = `<span class="badge boosted">🚀 ${d.getMonth()+1}/${d.getDate()}까지 노출중</span>`;
      btnHtml = `<button class="boost-btn" disabled>진행중</button>`;
    } else {
      btnHtml = `<button class="boost-btn" onclick="openBoostDialog('${p.id}', ${JSON.stringify(p.name)})">7일 끌어올리기</button>`;
    }
    el.innerHTML = `
      <h3>${escapeHtml(p.name)} ${badgeHtml}</h3>
      <div class="place-meta">${escapeHtml(p.address || '')} · 리뷰 ${p.review_count ?? 0}개</div>
      ${btnHtml}
      <div id="eligMsg-${p.id}" style="font-size:12px;color:#b45309;margin-top:6px;"></div>
    `;
    wrap.appendChild(el);
  }
}

window.openBoostDialog = async function (placeId, name) {
  const msgEl = document.getElementById(`eligMsg-${placeId}`);
  msgEl.textContent = '';

  const eligRes = await fetch(`/api/payments/boost/eligibility/${placeId}`, { credentials: 'include' });
  const elig = await eligRes.json();
  if (!elig.eligible) { msgEl.textContent = elig.reason || '지금은 끌어올릴 수 없어요'; return; }

  const orderRes = await fetch('/api/payments/boost/order', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
    body: JSON.stringify({ placeId }),
  });
  const order = await orderRes.json();
  if (!orderRes.ok) { msgEl.textContent = order.error || '주문 생성에 실패했어요'; return; }
  currentOrder = order;

  document.getElementById('dialogPlaceName').textContent = name;
  document.getElementById('dialogPrice').textContent = `${order.amount.toLocaleString()}원 · 7일`;

  document.getElementById('payment-method').innerHTML = '';
  document.getElementById('agreement').innerHTML = '';

  const customerKey = 'boost_' + Math.random().toString(36).slice(2);
  paymentWidget = PaymentWidget(config.clientKey, customerKey);
  const methodWidget = paymentWidget.renderPaymentMethods('#payment-method', { value: order.amount }, { variantKey: 'DEFAULT' });
  paymentWidget.renderAgreement('#agreement', { variantKey: 'AGREEMENT' });
  methodWidget.on('ready', () => { document.getElementById('payBtn').disabled = false; });

  document.getElementById('payDialog').showModal();
};

document.getElementById('payBtn').addEventListener('click', () => {
  if (!paymentWidget || !currentOrder) return;
  paymentWidget.requestPayment({
    orderId: currentOrder.orderId,
    orderName: currentOrder.orderName,
    successUrl: `${location.origin}/pay-success.html?kind=boost`,
    failUrl: `${location.origin}/pay-fail.html?kind=boost`,
  }).catch((err) => {
    if (err.code !== 'USER_CANCEL') alert('결제 요청에 실패했어요: ' + err.message);
  });
});

async function initAuthArea() {
  const area = document.getElementById('authArea');
  try {
    const res = await fetch('/api/auth/profile', { credentials: 'include' });
    if (!res.ok) throw new Error();
    const profile = await res.json();
    const displayName = profile.display_name || profile.name || '익명';
    const avatarSrc = profile.avatar_url || profile.picture;
    area.innerHTML = `<a href="/profile.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:inherit;">
      ${avatarSrc ? `<img src="${avatarSrc}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #1C1917;" />` : `<span style="width:26px;height:26px;border-radius:50%;background:#D9A441;border:1.5px solid #1C1917;display:flex;align-items:center;justify-content:center;font-size:13px;">👤</span>`}
      <span style="font-size:13px;font-weight:700">${escapeHtml(displayName)}님</span></a>`;
  } catch {
    area.innerHTML = `<a class="btn-ghost" href="/login.html" style="text-decoration:none;">로그인</a>
      <a class="btn-primary" href="/signup.html" style="text-decoration:none;margin-left:6px;">회원가입</a>`;
  }
  area.style.visibility = 'visible';
}

async function init() {
  const res = await fetch('/api/payments/config');
  config = await res.json();
  await initAuthArea();
  await loadPlaces();
}
init();
</script>
</body>
</html>
