<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>관리자 — 찐맛집 일괄 등록</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--paper-deep:#F6F4F1;--ink:#1C1917;--ink-soft:#8A8580;--stamp:#E1392A;--mustard:#D9A441;--green:#22c55e;--line:#E7E4DF;--radius:8px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(rgba(36,30,23,0.035) 1px,transparent 1px);background-size:4px 4px;}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:3px solid var(--ink);}
.brand-mark{font-family:'Black Han Sans',sans-serif;font-size:24px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:var(--stamp);color:var(--paper);
  border-radius:50%;border:2px solid var(--ink);transform:rotate(-6deg);}
.topbar h1{font-family:'Black Han Sans',sans-serif;font-size:20px;}
.topbar a{margin-left:auto;font-size:13px;color:var(--ink-soft);text-decoration:none;}
.topbar a:hover{text-decoration:underline;}
.container{max-width:960px;margin:0 auto;padding:32px 24px;}
.section-title{font-family:'Black Han Sans',sans-serif;font-size:18px;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border:2px solid var(--ink);border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;}
.filter-btn.active{background:var(--ink);color:var(--paper);}
.place-list{display:flex;flex-direction:column;gap:8px;}
.place-row{background:white;border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;
  display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:start;}
.place-row.success{border-color:var(--green);background:#f0fdf4;}
.place-row.fail{border-color:var(--stamp);background:#fef2f2;}
.place-row.pending-status{border-color:var(--mustard);background:#fffbeb;}
.place-row.running{opacity:.7;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:10px;font-weight:700;color:var(--ink-soft);}
.field input{font-family:'Noto Sans KR',sans-serif;font-size:12px;border:1.5px solid var(--ink);
  border-radius:var(--radius);padding:5px 7px;background:transparent;color:var(--ink);}
.field input:focus{outline:none;border-color:var(--stamp);}
.field input:disabled{opacity:.6;}
.row-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.btn-del{background:none;border:1.5px solid #ccc;border-radius:var(--radius);padding:3px 8px;font-size:11px;cursor:pointer;}
.btn-del:hover:not(:disabled){background:var(--stamp);color:white;border-color:var(--stamp);}
.row-status{font-size:11px;font-weight:700;white-space:nowrap;text-align:right;}
.cat-badge{font-size:10px;padding:2px 7px;border-radius:99px;border:1.5px solid var(--ink);background:var(--paper-deep,#F6F4F1);white-space:nowrap;}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0;}
.btn{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border-radius:var(--radius);cursor:pointer;border:2px solid var(--ink);}
.btn-primary{background:var(--stamp);color:var(--paper);}
.btn-primary:hover:not(:disabled){background:#B92C1F;}
.btn-primary:disabled{background:#bbb;border-color:#999;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--ink);}
.btn-ghost:hover{background:var(--ink);color:var(--paper);}
.progress-bar{flex:1;height:10px;background:#ddd;border-radius:99px;border:1.5px solid var(--ink);overflow:hidden;min-width:100px;}
.progress-fill{height:100%;background:var(--green);transition:width .3s;}
.progress-text{font-size:12px;font-weight:700;white-space:nowrap;}
.summary{background:white;border:2px solid var(--ink);border-radius:var(--radius);padding:16px 20px;margin-top:16px;display:none;}
.summary.show{display:block;}
.summary h3{font-family:'Black Han Sans',sans-serif;font-size:16px;margin-bottom:10px;}
.summary-stats{display:flex;gap:24px;font-size:13px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat span{font-size:24px;font-weight:900;}
.stat.ok span{color:var(--green);}
.stat.pend span{color:var(--mustard);}
.stat.fail span{color:var(--stamp);}
.auth-warning{background:#fef2f2;border:2px solid var(--stamp);border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:16px;display:none;}
.auth-warning.show{display:block;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-mark">찐</div>
  <h1>관리자 — 일괄 등록</h1>
  <a href="/inbox.html">신고/제보함 →</a>
  <a href="/" style="margin-left:12px;">← 사이트로</a>
  <button id="testModeBtn" onclick="toggleTestMode()" style="margin-left:12px;padding:6px 14px;border-radius:20px;border:2px solid var(--ink-soft);background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;">🧪 확인 중...</button>
</header>
<div class="container">
  <div id="authWarning" class="auth-warning">
    ⚠️ 로그인이 필요합니다. <a href="/">메인에서 Google 로그인 후 다시 접속하세요.</a>
  </div>
  <!-- 유저 접속 현황 -->
  <div class="section-title" style="cursor:pointer;" onclick="toggleUserSection()">
    👥 유저 접속 현황 <span id="userCountLabel" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span> <span id="userToggleIcon">▼</span>
  </div>
  <div id="userSection" style="margin-bottom:28px;">
    <div id="userList" style="overflow-x:auto;">
      <p style="color:var(--ink-soft);font-size:13px;">로딩 중...</p>
    </div>
  </div>

  <!-- 지역별 등록 현황 -->
  <div class="section-title" style="cursor:pointer;" onclick="toggleRegionSection()">
    🗺️ 지역별 등록 현황 <span id="regionCountLabel" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span> <span id="regionToggleIcon">▼</span>
  </div>
  <div id="regionSection" style="margin-bottom:28px;">
    <div id="regionOverview">
      <p style="color:var(--ink-soft);font-size:13px;">로딩 중...</p>
    </div>
  </div>

  <!-- 반려된 가게 -->
  <div class="section-title" style="cursor:pointer;" onclick="toggleRejectedSection()">
    🚫 반려된 가게 <span id="rejectedCountLabel" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span> <span id="rejectedToggleIcon">▼</span>
  </div>
  <div id="rejectedSection" style="margin-bottom:28px;">
    <div id="rejectedList" style="overflow-x:auto;">
      <p style="color:var(--ink-soft);font-size:13px;">로딩 중...</p>
    </div>
  </div>

  <!-- 사업자 인증(claim) 대기 -->
  <div class="section-title" style="cursor:pointer;" onclick="toggleClaimsSection()">
    🏪 사업자 인증 대기 <span id="claimsCountLabel" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span> <span id="claimsToggleIcon">▼</span>
  </div>
  <div id="claimsSection" style="margin-bottom:28px;">
    <div id="claimsList" style="overflow-x:auto;">
      <p style="color:var(--ink-soft);font-size:13px;">로딩 중...</p>
    </div>
  </div>

  <!-- 이번 주 인기 맛집 -->
  <div class="section-title">🔥 이번 주 인기 맛집</div>
  <div style="margin-bottom:28px;">
    <button class="btn btn-primary" onclick="refreshWeeklyTrending()" id="refreshTrendingBtn">🔄 지금 새로고침</button>
    <span id="refreshTrendingStatus" style="font-size:13px;margin-left:8px;color:var(--ink-soft);">보통은 매주 월요일 자동 크론이 처리해요. 새로 배포했거나 목록이 비어 보일 때만 눌러주세요.</span>
  </div>

  <!-- 리뷰 없는 기존 등록 건 -->
  <div class="section-title" style="cursor:pointer;" onclick="toggleMissingReviewsSection()">
    📝 리뷰 없는 기존 등록 건 <span id="missingReviewsCountLabel" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span> <span id="missingReviewsToggleIcon">▼</span>
  </div>
  <div id="missingReviewsSection" style="margin-bottom:28px;">
    <div style="margin-bottom:10px;">
      <button class="btn btn-primary" onclick="refreshAllNaverContent()" id="refreshAllBtn">🔄 전체 일괄 갱신</button>
      <span id="refreshAllStatus" style="font-size:13px;margin-left:8px;color:var(--ink-soft);"></span>
    </div>
    <div id="missingReviewsList" style="overflow-x:auto;">
      <p style="color:var(--ink-soft);font-size:13px;">로딩 중...</p>
    </div>
  </div>

  <div class="section-title">등록 대기 목록 <span id="totalCount" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span></div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCat('전체')">전체</button>
    <button class="filter-btn" onclick="filterCat('카페/디저트')">카페/디저트</button>
    <button class="filter-btn" onclick="filterCat('한식')">한식</button>
    <button class="filter-btn" onclick="filterCat('고기/구이')">고기/구이</button>
    <button class="filter-btn" onclick="filterCat('분식/간식')">분식/간식</button>
    <button class="filter-btn" onclick="filterCat('일식')">일식</button>
    <button class="filter-btn" onclick="filterCat('양식')">양식</button>
    <button class="filter-btn" onclick="filterCat('중식')">중식</button>
  </div>

  <div id="placeList" class="place-list"></div>
  <div style="margin-top:12px;"><button class="btn btn-ghost" onclick="addRow()">+ 직접 추가</button></div>

  <div class="actions">
    <button id="startBtn" class="btn btn-primary" onclick="startBatch(false)">▶ 일괄 검증 등록</button>
    <button id="forceBtn" class="btn btn-ghost" onclick="startBatch(true)" style="border-color:#E1392A;color:#E1392A;">⚡ 강제 등록 (검증 생략)</button>
    <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="progressText"></span>
  </div>

  <div class="summary" id="summary">
    <h3>등록 완료</h3>
    <div class="summary-stats">
      <div class="stat ok"><span id="statOk">0</span>검증 완료</div>
      <div class="stat pend"><span id="statPend">0</span>검토 대기</div>
      <div class="stat fail"><span id="statFail">0</span>반려</div>
    </div>
  </div>
</div>

let rows = [];
let currentFilter = '전체';

// 이미 지도에 등록(verified)된 이름은 목록에서 미리 제외
async function initRows() {
  let registeredNames = new Set();
  try {
    const res = await fetch('/api/places');
    if (res.ok) {
      const places = await res.json();
      registeredNames = new Set(places.map(p => p.name));
    }
  } catch (e) {
    console.error('[admin] 등록된 장소 목록 조회 실패', e);
  }

  rows = ALL
    .filter(p => !registeredNames.has(p.name))
    .map((p, i) => ({ id: i, ...p, status: 'idle' }));
  render();
}

function filterCat(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  render();
}

// ── 유저 현황 ────────────────────────────
const BADGE_NAMES = ['탐험 시작','🌱 새싹','🌿 풋내기','🌲 탐험가','⭐ 마스터','🌟 전설','👑 레전드'];

async function loadUsers() {
  const listEl = document.getElementById('userList');
  const countEl = document.getElementById('userCountLabel');
  try {
    const res = await fetch('/api/admin/users', { credentials: 'include' });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      listEl.innerHTML = `<p style="color:red">${body.error || '유저 목록을 불러오지 못했어요.'}</p>`;
      countEl.textContent = '';
      return;
    }
    const users = await res.json();

    if (!Array.isArray(users) || !users.length) {
      listEl.innerHTML = '<p style="color:var(--ink-soft);font-size:13px;">접속한 유저가 없어요.</p>';
      countEl.textContent = '(0명)';
      return;
    }

    countEl.textContent = `(${users.length}명)`;

    const now = new Date();
    const rows = users.map(u => {
      const last = u.last_visited_at ? new Date(u.last_visited_at) : null;
      const diff = last ? Math.floor((now - last) / 60000) : null;
      const timeStr = diff === null ? '–' : diff < 60 ? `${diff}분 전` : diff < 1440 ? `${Math.floor(diff/60)}시간 전` : `${Math.floor(diff/1440)}일 전`;
      const badge = BADGE_NAMES[Math.min(u.badge_level || 0, BADGE_NAMES.length - 1)];
      return `<tr>
        <td style="padding:8px 12px;border-bottom:1px solid var(--line);">${u.name || '–'}</td>
        <td style="padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:#8A8580;">${u.email}</td>
        <td style="padding:8px 12px;border-bottom:1px solid var(--line);">${badge}</td>
        <td style="padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;">${u.registered_count || 0}</td>
        <td style="padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;">${u.visit_count || 0}</td>
        <td style="padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;">${timeStr}</td>
      </tr>`;
    }).join('');

    listEl.innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:13px;font-family:'Noto Sans KR',sans-serif;">
        <thead>
          <tr style="background:rgba(36,30,23,.06);">
            <th style="padding:8px 12px;text-align:left;border-bottom:2px solid #1C1917;">이름</th>
            <th style="padding:8px 12px;text-align:left;border-bottom:2px solid #1C1917;">이메일</th>
            <th style="padding:8px 12px;text-align:left;border-bottom:2px solid #1C1917;">뱃지</th>
            <th style="padding:8px 12px;text-align:center;border-bottom:2px solid #1C1917;">등록수</th>
            <th style="padding:8px 12px;text-align:center;border-bottom:2px solid #1C1917;">방문수</th>
            <th style="padding:8px 12px;text-align:left;border-bottom:2px solid #1C1917;">마지막 접속</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>

// 1단계: 시/도 구분
const REGION_L1 = [
  { key: '서울', label: '서울', match: (addr) => addr.includes('서울') },
  { key: '경기', label: '경기도', match: (addr) => addr.includes('경기') },
  { key: '강원', label: '강원도', match: (addr) => addr.includes('강원') },
];
// 2단계: 경기도 안에서 지역 구분 (먼저 매치되는 순서대로 우선순위 적용 — 망포가 화성/수원과 겹칠 수 있어서 먼저 확인)
const GYEONGGI_L2 = [
  { key: '망포', match: (addr) => addr.includes('망포') },
  { key: '화성', match: (addr) => addr.includes('화성') },
  { key: '수원', match: (addr) => addr.includes('수원') },
  { key: '용인', match: (addr) => addr.includes('용인') },
];

function groupPlacesByRegion(places) {
  const groups = { '서울': [], '경기': { '용인': [], '망포': [], '화성': [], '수원': [], '기타': [] }, '강원': [], '기타': [] };
  places.forEach((p) => {
    const addr = p.address || '';
    const l1 = REGION_L1.find((r) => r.match(addr));
    if (!l1) { groups['기타'].push(p); return; }
    if (l1.key === '경기') {
      const l2 = GYEONGGI_L2.find((r) => r.match(addr));
      groups['경기'][l2 ? l2.key : '기타'].push(p);
    } else {
      groups[l1.key].push(p);
    }
  });
  return groups;
}

function regionPlaceRowHtml(p) {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);">
      <div style="min-width:0;">

        <div style="font-size:11px;color:var(--ink-soft);">${esc(p.address)}</div>

        color:#666;background:none;border-radius:6px;font-size:11px;cursor:pointer;">🗑</button>

}

function regionGroupHtml(label, list, opts = {}) {
  const open = opts.open ? ' open' : '';
  const marginLeft = opts.indent ? 'margin:8px 0 8px 12px;' : 'margin-bottom:10px;';
  return `
    <details${open} style="${marginLeft}border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;">
      <summary style="cursor:pointer;font-weight:700;font-size:${opts.indent ? 13 : 14}px;">${label} <span style="color:var(--ink-soft);font-weight:400;">(${list.length}개)</span></summary>
      <div style="margin-top:8px;">${list.length ? list.map(regionPlaceRowHtml).join('') : '<p style="color:var(--ink-soft);font-size:12px;">등록된 곳이 없어요.</p>'}</div>
    </details>`;
}

async function loadRegionOverview() {
  const wrapEl = document.getElementById('regionOverview');
  const countEl = document.getElementById('regionCountLabel');
  try {
    const res = await fetch('/api/places');
    if (!res.ok) { wrapEl.innerHTML = '<p style="color:red">불러오지 못했어요.</p>'; return; }
    const places = await res.json();
    countEl.textContent = `(${places.length}개)`;
    const groups = groupPlacesByRegion(places);
    const gGroup = groups['경기'];
    const gTotal = ['용인', '망포', '화성', '수원', '기타'].reduce((sum, k) => sum + gGroup[k].length, 0);
    const gyeonggiInner = ['용인', '망포', '화성', '수원', '기타']
      .map((k) => regionGroupHtml(k, gGroup[k], { indent: true }))
      .join('');

    wrapEl.innerHTML =
      regionGroupHtml('서울', groups['서울']) +
      `<details open style="margin-bottom:10px;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;">
        <summary style="cursor:pointer;font-weight:700;font-size:14px;">경기도 <span style="color:var(--ink-soft);font-weight:400;">(${gTotal}개)</span></summary>
        <div>${gyeonggiInner}</div>
      </details>` +
      regionGroupHtml('강원도', groups['강원']) +
      regionGroupHtml('기타 지역', groups['기타']);
  } catch (err) {
    console.error('[admin] loadRegionOverview 실패', err);
    wrapEl.innerHTML = '<p style="color:red">불러오는 중 오류가 발생했어요.</p>';
  }
}

function getFiltered() {

  return rows.filter(r => r.category && r.category.includes(currentFilter));
}

  const filtered = getFiltered();
  document.getElementById('totalCount').textContent = `(전체 ${rows.length}개 / 표시 ${filtered.length}개)`;
  const list = document.getElementById('placeList');
  list.innerHTML = filtered.map((r) => `
    <div class="place-row ${r.status === 'success' ? 'success' : r.status === 'pending-status' ? 'pending-status' : r.status === 'fail' ? 'fail' : r.status === 'running' ? 'running' : ''}" id="row-${r.id}">
      <div class="field" style="grid-column:1">
        <label>가게 이름</label>
        <input value="${esc(r.name)}" oninput="update(${r.id},'name',this.value)" ${r.status!=='idle'?'disabled':''}/>
      </div>
      <div class="field" style="grid-column:2">
        <label>주소</label>
        <input value="${esc(r.address)}" oninput="update(${r.id},'address',this.value)" ${r.status!=='idle'?'disabled':''}/>
      </div>
      <div class="row-actions" style="grid-column:3;grid-row:1/3">
        <span class="cat-badge">${esc(r.category)}</span>
        <button class="btn-del" onclick="removeRow(${r.id})" ${r.status!=='idle'?'disabled':''}>삭제</button>
        <div class="row-status">${statusIcon(r.status)}</div>
      </div>
      <div class="field" style="grid-column:1/3">
        <label>한줄평</label>
        <input value="${esc(r.comment)}" oninput="update(${r.id},'comment',this.value)" ${r.status!=='idle'?'disabled':''}/>
      </div>
    </div>
  `).join('');
}

function statusIcon(s) {
  if (s==='idle') return '';
  if (s==='running') return '⏳';
  if (s==='success') return '✅ 완료';
  if (s==='pending-status') return '🕐 검토';
  if (s==='fail') return '❌ 반려';
  return '';
}

function esc(str) { return (str||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function update(id, key, val) { const r = rows.find(r=>r.id===id); if(r) r[key]=val; }
function removeRow(id) { rows=rows.filter(r=>r.id!==id); render(); }
function addRow() {
  rows.push({id:Date.now(),name:'',address:'',category:'카페',comment:'',status:'idle'});
  currentFilter='전체';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent==='전체'));
  render();
}

async function startBatch(force = false) {
  const meRes = await fetch('/api/auth/me', {credentials:'include'});
  if (!meRes.ok) { document.getElementById('authWarning').classList.add('show'); return; }

  const idle = rows.filter(r => r.status === 'idle');
  if (!idle.length) { alert('등록할 항목이 없어요.'); return; }

  document.getElementById('startBtn').disabled = true;
  document.getElementById('forceBtn').disabled = true;
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('summary').classList.remove('show');
  currentFilter = '전체';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent==='전체'));

  let done=0, ok=0, pend=0, fail=0;

  for (const row of idle) {
    row.status = 'running'; render();
    document.getElementById('progressText').textContent = `${done+1}/${idle.length}`;

    try {
      const geoRes = await fetch(`/api/geocode?address=${encodeURIComponent(row.address)}`);
      if (!geoRes.ok) { row.status='fail'; fail++; done++; updateProgress(done,idle.length); render(); continue; }
      const {lat, lng} = await geoRes.json();

      const endpoint = force ? '/api/admin/force-place' : '/api/places';
      const regRes = await fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({name:row.name, address:row.address, lat, lng, category:row.category, comment:row.comment}),
      });

      // 응답 파싱 실패해도 force면 성공 처리
      let result = {};
      try { result = await regRes.json(); } catch(_) {}

      if (!regRes.ok) { row.status='fail'; fail++; }
      else if (force || result.status==='verified') { row.status='success'; ok++; }
      else if (result.status==='pending') { row.status='pending-status'; pend++; }
      else { row.status='fail'; fail++; }
    } catch(e) { row.status='fail'; fail++; }

    done++; updateProgress(done, idle.length); render();
    await new Promise(r=>setTimeout(r,900));
  }

  document.getElementById('startBtn').disabled = false;
  document.getElementById('forceBtn').disabled = false;
  document.getElementById('progressText').textContent = '완료!';
  document.getElementById('statOk').textContent = ok;
  document.getElementById('statPend').textContent = pend;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('summary').classList.add('show');
}

function updateProgress(done, total) {
  document.getElementById('progressFill').style.width = `${Math.round(done/total*100)}%`;
}

initRows();
loadUsers();
loadRejected();
loadClaims();
loadMissingReviews();
loadRegionOverview();
loadTestModeStatus();

async function loadTestModeStatus() {
  try {
    const res = await fetch('/api/admin/test-mode/status', { credentials: 'include' });
    const body = await res.json();
    renderTestModeBtn(body.testMode);
  } catch {
    renderTestModeBtn(null);
  }
}

function renderTestModeBtn(testMode) {
  const btn = document.getElementById('testModeBtn');
  if (!btn) return;
  if (testMode === null) {
    btn.textContent = '🧪 상태 확인 실패';
    return;
  }
  if (testMode) {
    btn.textContent = '🧪 테스트 모드 ON (끄기)';
    btn.style.borderColor = '#E1392A';
    btn.style.color = '#E1392A';
  } else {
    btn.textContent = '🧪 테스트 모드 OFF (켜기)';
    btn.style.borderColor = 'var(--ink-soft)';
    btn.style.color = 'var(--ink-soft)';
  }
}

async function toggleTestMode() {
  const btn = document.getElementById('testModeBtn');
  const isOn = btn.textContent.includes('ON');
  const endpoint = isOn ? '/api/admin/test-mode/off' : '/api/admin/test-mode/on';
  try {
    const res = await fetch(endpoint, { credentials: 'include' });
    const body = await res.json();
    renderTestModeBtn(body.testMode);
    alert(body.testMode
      ? '테스트 모드 켜짐 — 지금부터 등록/수정한 내용은 테스트 데이터에만 쌓여요.'
      : '테스트 모드 꺼짐 — 원래 운영 데이터로 돌아왔어요.');
    location.reload();
  } catch {
    alert('테스트 모드 전환에 실패했어요.');
  }
}
