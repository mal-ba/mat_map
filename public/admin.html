<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>관리자 — 찐맛집 일괄 등록</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#E7DCC3;--ink:#241E17;--ink-soft:#5A4F3F;--stamp:#B23A2E;--mustard:#D9A441;--green:#22c55e;--radius:4px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(rgba(36,30,23,0.035) 1px,transparent 1px);background-size:4px 4px;}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:3px solid var(--ink);}
.brand-mark{font-family:'Black Han Sans',sans-serif;font-size:24px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;background:var(--stamp);color:var(--paper);
  border-radius:50%;border:2px solid var(--ink);transform:rotate(-6deg);}
.topbar h1{font-family:'Black Han Sans',sans-serif;font-size:20px;}
.topbar a{margin-left:auto;font-size:13px;color:var(--ink-soft);text-decoration:none;}
.topbar a:hover{text-decoration:underline;}
.container{max-width:960px;margin:0 auto;padding:32px 24px;}
.section-title{font-family:'Black Han Sans',sans-serif;font-size:18px;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border:2px solid var(--ink);border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;}
.filter-btn.active{background:var(--ink);color:var(--paper);}
.place-list{display:flex;flex-direction:column;gap:8px;}
.place-row{background:white;border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;
  display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:start;}
.place-row.success{border-color:var(--green);background:#f0fdf4;}
.place-row.fail{border-color:var(--stamp);background:#fef2f2;}
.place-row.pending-status{border-color:var(--mustard);background:#fffbeb;}
.place-row.running{opacity:.7;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:10px;font-weight:700;color:var(--ink-soft);}
.field input{font-family:'Noto Sans KR',sans-serif;font-size:12px;border:1.5px solid var(--ink);
  border-radius:var(--radius);padding:5px 7px;background:transparent;color:var(--ink);}
.field input:focus{outline:none;border-color:var(--stamp);}
.field input:disabled{opacity:.6;}
.row-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.btn-del{background:none;border:1.5px solid #ccc;border-radius:var(--radius);padding:3px 8px;font-size:11px;cursor:pointer;}
.btn-del:hover:not(:disabled){background:var(--stamp);color:white;border-color:var(--stamp);}
.row-status{font-size:11px;font-weight:700;white-space:nowrap;text-align:right;}
.cat-badge{font-size:10px;padding:2px 7px;border-radius:99px;border:1.5px solid var(--ink);background:var(--paper-deep,#DCCEA9);white-space:nowrap;}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0;}
.btn{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border-radius:var(--radius);cursor:pointer;border:2px solid var(--ink);}
.btn-primary{background:var(--stamp);color:var(--paper);}
.btn-primary:hover:not(:disabled){background:#8C2C22;}
.btn-primary:disabled{background:#bbb;border-color:#999;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--ink);}
.btn-ghost:hover{background:var(--ink);color:var(--paper);}
.progress-bar{flex:1;height:10px;background:#ddd;border-radius:99px;border:1.5px solid var(--ink);overflow:hidden;min-width:100px;}
.progress-fill{height:100%;background:var(--green);transition:width .3s;}
.progress-text{font-size:12px;font-weight:700;white-space:nowrap;}
.summary{background:white;border:2px solid var(--ink);border-radius:var(--radius);padding:16px 20px;margin-top:16px;display:none;}
.summary.show{display:block;}
.summary h3{font-family:'Black Han Sans',sans-serif;font-size:16px;margin-bottom:10px;}
.summary-stats{display:flex;gap:24px;font-size:13px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat span{font-size:24px;font-weight:900;}
.stat.ok span{color:var(--green);}
.stat.pend span{color:var(--mustard);}
.stat.fail span{color:var(--stamp);}
.auth-warning{background:#fef2f2;border:2px solid var(--stamp);border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:16px;display:none;}
.auth-warning.show{display:block;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-mark">찐</div>
  <h1>관리자 — 일괄 등록</h1>
  <a href="/">← 사이트로</a>
</header>
<div class="container">
  <div id="authWarning" class="auth-warning">
    ⚠️ 로그인이 필요합니다. <a href="/">메인에서 Google 로그인 후 다시 접속하세요.</a>
  </div>
  <div class="section-title">등록 대기 목록 <span id="totalCount" style="font-size:14px;font-weight:400;color:var(--ink-soft);"></span></div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCat('전체')">전체</button>
    <button class="filter-btn" onclick="filterCat('카페/디저트')">카페/디저트</button>
    <button class="filter-btn" onclick="filterCat('한식')">한식</button>
    <button class="filter-btn" onclick="filterCat('고기/구이')">고기/구이</button>
    <button class="filter-btn" onclick="filterCat('분식/간식')">분식/간식</button>
    <button class="filter-btn" onclick="filterCat('일식')">일식</button>
    <button class="filter-btn" onclick="filterCat('양식')">양식</button>
    <button class="filter-btn" onclick="filterCat('중식')">중식</button>
  </div>

  <div id="placeList" class="place-list"></div>
  <div style="margin-top:12px;"><button class="btn btn-ghost" onclick="addRow()">+ 직접 추가</button></div>

  <div class="actions">
    <button id="startBtn" class="btn btn-primary" onclick="startBatch(false)">▶ 일괄 검증 등록</button>
    <button id="forceBtn" class="btn btn-ghost" onclick="startBatch(true)" style="border-color:#B23A2E;color:#B23A2E;">⚡ 강제 등록 (검증 생략)</button>
    <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="progressText"></span>
  </div>

  <div class="summary" id="summary">
    <h3>등록 완료</h3>
    <div class="summary-stats">
      <div class="stat ok"><span id="statOk">0</span>검증 완료</div>
      <div class="stat pend"><span id="statPend">0</span>검토 대기</div>
      <div class="stat fail"><span id="statFail">0</span>반려</div>
    </div>
  </div>
</div>

  // ── 중식 ────────────────────────────────────────────
  {name:'홍보각',address:'서울 중구 퇴계로20길 37',category:'중식',comment:'서울 3대 중국집 중 하나. 북경오리가 시그니처. 특별한 날 가는 고급 중식당'},

  {name:'미향',address:'서울 마포구 독막로 331',category:'중식',comment:'합정 중식 맛집. 마라샹궈가 시그니처. 마라 마니아들의 성지. 매운맛 조절 가능'},
];

let rows = ALL.map((p, i) => ({ id: i, ...p, status: 'idle' }));
let currentFilter = '전체';

function filterCat(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  render();
}

function getFiltered() {
  if (currentFilter === '전체') return rows;
  return rows.filter(r => r.category && r.category.includes(currentFilter));
}

function render() {
  const filtered = getFiltered();
  document.getElementById('totalCount').textContent = `(전체 ${rows.length}개 / 표시 ${filtered.length}개)`;
  const list = document.getElementById('placeList');
  list.innerHTML = filtered.map((r) => `
    <div class="place-row ${r.status === 'success' ? 'success' : r.status === 'pending-status' ? 'pending-status' : r.status === 'fail' ? 'fail' : r.status === 'running' ? 'running' : ''}" id="row-${r.id}">
      <div class="field" style="grid-column:1">
        <label>가게 이름</label>
        <input value="${esc(r.name)}" oninput="update(${r.id},'name',this.value)" ${r.status!=='idle'?'disabled':''}/>
      </div>
      <div class="field" style="grid-column:2">
        <label>주소</label>
        <input value="${esc(r.address)}" oninput="update(${r.id},'address',this.value)" ${r.status!=='idle'?'disabled':''}/>
      </div>
      <div class="row-actions" style="grid-column:3;grid-row:1/3">
        <span class="cat-badge">${esc(r.category)}</span>
        <button class="btn-del" onclick="removeRow(${r.id})" ${r.status!=='idle'?'disabled':''}>삭제</button>
        <div class="row-status">${statusIcon(r.status)}</div>
      </div>
      <div class="field" style="grid-column:1/3">
        <label>한줄평</label>
        <input value="${esc(r.comment)}" oninput="update(${r.id},'comment',this.value)" ${r.status!=='idle'?'disabled':''}/>
      </div>
    </div>
  `).join('');
}

function statusIcon(s) {
  if (s==='idle') return '';
  if (s==='running') return '⏳';
  if (s==='success') return '✅ 완료';
  if (s==='pending-status') return '🕐 검토';
  if (s==='fail') return '❌ 반려';
  return '';
}

function esc(str) { return (str||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function update(id, key, val) { const r = rows.find(r=>r.id===id); if(r) r[key]=val; }
function removeRow(id) { rows=rows.filter(r=>r.id!==id); render(); }
function addRow() {
  rows.push({id:Date.now(),name:'',address:'',category:'카페',comment:'',status:'idle'});
  currentFilter='전체';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent==='전체'));
  render();
}

async function startBatch(force = false) {
  const meRes = await fetch('/api/auth/me', {credentials:'include'});
  if (!meRes.ok) { document.getElementById('authWarning').classList.add('show'); return; }

  const idle = rows.filter(r => r.status === 'idle');
  if (!idle.length) { alert('등록할 항목이 없어요.'); return; }

  document.getElementById('startBtn').disabled = true;
  document.getElementById('forceBtn').disabled = true;
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('summary').classList.remove('show');
  currentFilter = '전체';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent==='전체'));

  let done=0, ok=0, pend=0, fail=0;

  for (const row of idle) {
    row.status = 'running'; render();
    document.getElementById('progressText').textContent = `${done+1}/${idle.length}`;

    try {
      const geoRes = await fetch(`/api/geocode?address=${encodeURIComponent(row.address)}`);
      if (!geoRes.ok) { row.status='fail'; fail++; done++; updateProgress(done,idle.length); render(); continue; }
      const {lat, lng} = await geoRes.json();

      const endpoint = force ? '/api/admin/force-place' : '/api/places';
      const regRes = await fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({name:row.name, address:row.address, lat, lng, category:row.category, comment:row.comment}),
      });

      // 응답 파싱 실패해도 force면 성공 처리
      let result = {};
      try { result = await regRes.json(); } catch(_) {}

      if (!regRes.ok) { row.status='fail'; fail++; }
      else if (force || result.status==='verified') { row.status='success'; ok++; }
      else if (result.status==='pending') { row.status='pending-status'; pend++; }
      else { row.status='fail'; fail++; }
    } catch(e) { row.status='fail'; fail++; }

    done++; updateProgress(done, idle.length); render();
    await new Promise(r=>setTimeout(r,900));
  }

  document.getElementById('startBtn').disabled = false;
  document.getElementById('forceBtn').disabled = false;
  document.getElementById('progressText').textContent = '완료!';
  document.getElementById('statOk').textContent = ok;
  document.getElementById('statPend').textContent = pend;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('summary').classList.add('show');
}

function updateProgress(done, total) {
  document.getElementById('progressFill').style.width = `${Math.round(done/total*100)}%`;
}

render();
</script>
