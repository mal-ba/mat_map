<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>찐맛집 — 사람이 찾고, AI가 확인한 진짜 맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
.hero{
  max-width:720px; margin:0 auto; padding:56px 20px 36px; text-align:center;
}
.hero h1{
  font-family:'Black Han Sans',sans-serif; font-size:30px; margin:0 0 8px;
}
.hero p{ color:var(--ink-soft); font-size:14px; margin:0 0 28px; }

.search-row{
  display:flex; gap:10px; max-width:560px; margin:0 auto;
}
.search-row input{
  flex:1; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px;
  font-family:'Noto Sans KR',sans-serif; font-size:15px;
}
.search-row input:focus{ outline:none; border-color:var(--stamp); }
.search-row button{
  padding:0 20px; background:var(--stamp); color:#fff; border:none; border-radius:12px;
  font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
}

.map-cta{
  display:flex; align-items:center; justify-content:center; gap:8px;
  max-width:560px; margin:14px auto 0; padding:13px; border:1.5px solid var(--line);
  border-radius:12px; text-decoration:none; color:var(--ink); font-weight:700; font-size:14px;
}
.map-cta:hover{ background:var(--paper-deep); }

.content{ max-width:960px; margin:0 auto; padding:8px 20px 60px; }

.place-tile{
  background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden;
  cursor:pointer; transition:box-shadow .15s, transform .15s;
}
.place-tile:hover{ box-shadow:0 8px 20px rgba(28,25,23,.1); transform:translateY(-2px); }
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="brand" style="text-decoration:none;color:inherit;">
    <span class="brand-mark">찐</span>
    <div class="brand-text">
      <strong>찐맛집</strong>
      <span>사람이 찾고, AI가 확인한 진짜 맛집</span>
    </div>
  </a>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="/community.html" class="btn-ghost" style="display:inline-block;text-decoration:none;">👥 커뮤니티</a>
    <a href="/subscribe.html" class="btn-ghost" style="display:inline-block;text-decoration:none;">🎯 맞춤추천</a>
    <a href="/boost.html" class="btn-ghost" style="display:inline-block;text-decoration:none;">🚀 끌어올리기</a>
    <div class="auth-area" id="authArea" style="visibility:hidden;"></div>
  </div>
</header>

<div class="hero">
  <h1>오늘은 뭐 먹지?</h1>
  <p>가게 이름, 주소, 카테고리로 검색해보세요</p>

  <form id="homeSearchForm" class="search-row">
    <input id="homeSearchInput" type="text" placeholder="예: 곱창, 성수동 카페..." autocomplete="off" />
    <button type="submit">검색</button>
  </form>

  <a href="/map.html" class="map-cta">🗺️ 지도에서 둘러보기</a>
</div>

<div class="content">
  <div id="searchResults" style="display:none;"></div>
  <div id="categoryRows"></div>
</div>

<footer style="text-align:center;padding:20px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);margin-top:20px;">
  <a href="/privacy.html" style="color:var(--ink-soft);text-decoration:underline;">개인정보처리방침</a>
</footer>

<script src="/home.js"></script>
</body>
</html>
