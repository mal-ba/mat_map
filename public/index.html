<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>찐맛집 — 진짜 검증된 맛집 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<script src="/config.js"></script>
<style>.hidden { display: none !important; }</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">찐</span>
    <div class="brand-text">
      <strong>찐맛집</strong>
      <span>사람이 찾고, AI가 확인한 진짜 맛집</span>
    </div>
  </div>
  <div class="auth-area" id="authArea">
    <button class="btn-ghost" onclick="triggerGoogleLogin()">Google로 시작하기</button>
  </div>
</header>

<main class="layout">
  <aside class="panel">
    <div class="panel-head">
      <h2>공개된 맛집</h2>
      <button id="addBtn" class="btn-primary" disabled title="로그인 후 등록할 수 있어요">+ 맛집 등록</button>
    </div>
    <ul id="placeList" class="place-list">
      <li class="empty-state">아직 검증된 맛집이 없어요.<br>첫 번째로 등록해보세요.</li>
    </ul>
  </aside>

  <section class="map-wrap" style="position:relative;">
    <!-- 스트리트뷰 오버레이: map-google 밖에 위치해야 DOM 충돌 없음 -->
    <div id="streetview-pane" class="hidden" style="position:absolute;inset:0;top:48px;z-index:20;">
      <div id="streetview-map" style="width:100%;height:100%;"></div>
      <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:30;
                  background:rgba(36,30,23,0.88);color:#E7DCC3;padding:6px 16px;
                  border-radius:4px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;">
        🚶 <span id="streetview-label"></span>
      </div>
      <button onclick="closeStreetView()" style="position:absolute;top:12px;right:12px;z-index:30;
              background:#B23A2E;color:#E7DCC3;border:2px solid #241E17;border-radius:4px;
              padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;">✕ 지도로</button>
    </div>
    <div class="map-tabs">
      <button class="map-tab active" data-provider="jjin">✨ 찐지도</button>
      <button class="map-tab" data-provider="kakao">카카오맵</button>
      <button class="map-tab" data-provider="naver">네이버지도</button>
      <button class="map-tab" data-provider="google">구글맵</button>
    </div>
    <!-- 장소 검색창 (카카오맵 탭일 때만 활성) -->
    <div id="mapSearchBar" style="position:absolute;top:56px;left:50%;transform:translateX(-50%);
         z-index:10;display:flex;gap:0;width:min(360px,90%);box-shadow:0 2px 8px rgba(0,0,0,0.2);">
      <input id="mapSearchInput" type="text" placeholder="🔍 가게 이름으로 검색"
        style="flex:1;padding:10px 14px;border:2px solid #241E17;border-right:none;
               border-radius:4px 0 0 4px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;"
        onkeydown="if(event.key==='Enter') searchKakaoPlaces(this.value)" />
      <button onclick="searchKakaoPlaces(document.getElementById('mapSearchInput').value)"
        style="padding:10px 16px;background:#B23A2E;color:#E7DCC3;border:2px solid #241E17;
               border-left:none;border-radius:0 4px 4px 0;font-weight:700;font-size:14px;cursor:pointer;">
        검색
      </button>
    </div>
    <div id="searchMsg" style="position:absolute;top:104px;left:50%;transform:translateX(-50%);
         z-index:10;font-size:12px;color:#B23A2E;"></div>

    <div id="map-jjin" class="map-instance active"></div>
    <div id="map-kakao" class="map-instance"></div>
    <div id="map-naver" class="map-instance"></div>
    <div id="map-google" class="map-instance"></div>
  </section>
</main>

<!-- 등록 모달 -->
<dialog id="registerModal">
  <form id="registerForm" class="register-form">
    <h3>새 맛집 등록</h3>
    <p class="hint">등록하면 카카오맵 + AI가 실제 존재 여부와 신뢰도를 확인한 뒤 지도에 공개됩니다.</p>

    <label>가게 이름
      <input name="name" required placeholder="예: 왕십리곱창골목" />
    </label>

    <label>주소
      <div style="position:relative;">
        <input name="address" id="addressInput" required placeholder="도로명 또는 지번 주소 입력" autocomplete="off" />
        <span id="geocodeStatus" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;"></span>
      </div>
      <span id="geocodeResult" style="font-size:12px;margin-top:4px;display:block;min-height:16px;color:#888;"></span>
    </label>

    <!-- 좌표: 주소 검색으로 자동 입력 -->
    <input type="hidden" name="lat" id="latInput" />
    <input type="hidden" name="lng" id="lngInput" />

    <label>표시할 지도 선택
      <div style="display:flex;gap:16px;margin-top:6px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:400;cursor:pointer;">
          <input type="checkbox" name="map_kakao" value="kakao" checked style="width:16px;height:16px;"> 카카오맵
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:400;cursor:pointer;">
          <input type="checkbox" name="map_naver" value="naver" checked style="width:16px;height:16px;"> 네이버지도
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:400;cursor:pointer;">
          <input type="checkbox" name="map_google" value="google" checked style="width:16px;height:16px;"> 구글맵
        </label>
      </div>
    </label>

    <label>카테고리
      <input name="category" placeholder="예: 분식 / 곱창 / 카페" />
    </label>
    <label>한줄평
      <textarea name="comment" rows="2" placeholder="여기 진짜 맛있어요..."></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" id="cancelBtn" class="btn-ghost">취소</button>
      <button type="submit" class="btn-primary">검증 요청</button>
    </div>
  </form>
</dialog>

<!-- 검증 진행 스탬프 오버레이 -->
<div id="verifyOverlay" class="verify-overlay hidden">
  <div class="stamp-spin">확인중</div>
  <p>실존 여부와 신뢰도를 확인하고 있어요...</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleLogin()"></script>
<script src="/app.js"></script>
<footer style="text-align:center;padding:20px;font-size:12px;color:#5A4F3F;border-top:2px solid rgba(36,30,23,0.16);margin-top:auto;">
  <a href="/privacy.html" style="color:#5A4F3F;text-decoration:underline;">개인정보처리방침</a>
  &nbsp;|&nbsp; © 2026 찐맛집
</footer>
</body>
</html>
