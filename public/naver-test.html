<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>네이버 지도 테스트</title>
<script src="/config.js"></script>
<style>
body { margin: 0; font-family: sans-serif; }
#info { padding: 16px; background: #f5f5f5; font-size: 13px; line-height: 1.8; }
#map { width: 100%; height: 60vh; }
#log { padding: 16px; font-size: 12px; white-space: pre-wrap; background: #1a1a1a; color: #0f0; min-height: 100px; }
</style>
</head>
<body>
<div id="info">
  <b>Client ID:</b> <span id="cid">로딩중...</span><br>
  <b>현재 URL:</b> <span id="url"></span><br>
  <b>상태:</b> <span id="status">대기중...</span>
</div>
<div id="map"></div>
<div id="log">로그 대기중...</div>

<script>
const log = (msg) => {
  document.getElementById('log').textContent += '\n' + msg;
};

const origError = console.error;
console.error = function(...args) {
  log('[ERROR] ' + args.join(' '));
  origError.apply(console, args);
};
console.log = function(...args) {
  log('[LOG] ' + args.join(' '));
};

window.addEventListener('DOMContentLoaded', () => {
  const clientId = window.__CONFIG__?.NAVER_MAP_CLIENT_ID || '(없음)';
  document.getElementById('cid').textContent = clientId;
  document.getElementById('url').textContent = location.origin;

  if (!clientId || clientId === '(없음)') {
    document.getElementById('status').textContent = '❌ Client ID 없음';
    return;
  }

  document.getElementById('status').textContent = '⏳ SDK 로딩 중...';
  log('Client ID: ' + clientId);
  log('SDK URL: https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=' + clientId);

  const script = document.createElement('script');
  script.src = `https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=${clientId}`;
  script.onload = () => {
    log('SDK 로드 완료');
    try {
      const map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.5665, 126.978),
        zoom: 13
      });
      document.getElementById('status').textContent = '✅ 지도 로드 성공!';
      log('지도 생성 성공!');
    } catch(e) {
      document.getElementById('status').textContent = '❌ 지도 생성 실패: ' + e.message;
      log('지도 생성 에러: ' + e.message);
    }
  };
  script.onerror = (e) => {
    document.getElementById('status').textContent = '❌ SDK 로드 자체 실패';
    log('SDK 스크립트 로드 실패');
  };
  document.head.appendChild(script);
});
</script>
</body>
</html>
