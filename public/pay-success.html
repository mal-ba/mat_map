<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 처리 중 — 찐맛집</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;margin:0;background:#fff;color:#1C1917;text-align:center;padding:20px;}
h1{font-family:'Black Han Sans',sans-serif;font-size:20px;}
.spinner{width:36px;height:36px;border:4px solid #E7E4DF;border-top-color:#E1392A;border-radius:50%;
  animation:spin 1s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:#E1392A;font-weight:700;text-decoration:none;margin-top:16px;}
</style>
</head>
<body>
<div class="spinner" id="spinner"></div>
<h1 id="statusText">결제를 확인하고 있어요...</h1>
<p id="detailText" style="color:#8A8580;font-size:13px;"></p>
<a id="backLink" href="/" style="display:none;">← 돌아가기</a>

<script>
const params = new URLSearchParams(location.search);
const kind = params.get('kind'); // 'boost' | 'subscribe'
const paymentKey = params.get('paymentKey');
const orderId = params.get('orderId');
const amount = params.get('amount');
const authKey = params.get('authKey');
const customerKey = params.get('customerKey');

async function run() {
  try {
    let res, data;
    if (kind === 'boost') {
      res = await fetch('/api/payments/boost/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
      });
    } else if (kind === 'subscribe') {
      res = await fetch('/api/payments/subscribe/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ authKey, customerKey }),
      });
    } else {
      throw new Error('알 수 없는 결제 유형이에요');
    }
    data = await res.json();
    if (!res.ok) throw new Error(data.error || '처리 중 오류가 발생했어요');

    document.getElementById('spinner').style.display = 'none';
    document.getElementById('statusText').textContent = kind === 'boost' ? '🎉 끌어올리기 적용 완료!' : '🎉 구독이 시작됐어요!';
    document.getElementById('detailText').textContent = kind === 'boost'
      ? '7일 동안 목록 상단에 노출돼요.'
      : '이제 맞춤 추천을 받아보세요.';
    const back = document.getElementById('backLink');
    back.href = kind === 'boost' ? '/boost.html' : '/subscribe.html';
    back.style.display = 'inline-block';
  } catch (err) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('statusText').textContent = '결제 처리에 실패했어요';
    document.getElementById('detailText').textContent = err.message;
    const back = document.getElementById('backLink');
    back.href = kind === 'boost' ? '/boost.html' : '/subscribe.html';
    back.style.display = 'inline-block';
  }
}
run();
</script>
</body>
</html>
