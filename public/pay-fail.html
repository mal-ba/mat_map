<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 실패 — 찐맛집</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;margin:0;background:#fff;color:#1C1917;text-align:center;padding:20px;}
h1{font-family:'Black Han Sans',sans-serif;font-size:20px;}
a{color:#E1392A;font-weight:700;text-decoration:none;margin-top:16px;}
</style>
</head>
<body>
<h1>❌ 결제가 취소됐어요</h1>
<p id="reason" style="color:#8A8580;font-size:13px;"></p>
<a href="/" id="backLink">← 돌아가기</a>
<script>
const params = new URLSearchParams(location.search);
document.getElementById('reason').textContent = params.get('message') || '결제 중 취소되었거나 실패했어요.';
const kind = params.get('kind');
document.getElementById('backLink').href = kind === 'subscribe' ? '/subscribe.html' : '/boost.html';
</script>
</body>
</html>
