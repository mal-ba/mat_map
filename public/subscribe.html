<script>
let config = null;
let tossPayments = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function checkSubscription() {
  const res = await fetch('/api/payments/subscribe/status', { credentials: 'include' });
  const sub = await res.json();
  const active = sub.status === 'active' && sub.current_period_end && new Date(sub.current_period_end) > new Date();

  if (active) {
    document.getElementById('subscribeCard').style.display = 'none';
    document.getElementById('mainArea').style.display = 'block';
    loadPreferences();
  } else {
    document.getElementById('subscribeCard').style.display = 'block';
    document.getElementById('mainArea').style.display = 'none';
    document.getElementById('priceText').textContent = `월 ${config.subscriptionPrice.toLocaleString()}원`;
  }
}

async function loadPreferences() {
  const res = await fetch('/api/payments/preferences', { credentials: 'include' });
  const data = await res.json();
  document.getElementById('prefInput').value = data.content || '';
}

document.getElementById('subscribeBtn').addEventListener('click', async () => {
  try {
    if (!tossPayments) {
      alert('결제 시스템이 아직 초기화되지 않았어요. (config: ' + JSON.stringify(config) + ')');
      return;
    }

    const meRes = await fetch('/api/auth/profile', { credentials: 'include' });
    if (!meRes.ok) { location.href = '/login.html'; return; }
    const me = await meRes.json();

    const customerKey = 'user_' + me.id;
    const payment = tossPayments.payment({ customerKey });
    await payment.requestBillingAuth({
      method: 'CARD',
      successUrl: `${location.origin}/pay-success.html?kind=subscribe`,
      failUrl: `${location.origin}/pay-fail.html?kind=subscribe`,
      customerEmail: me.email,
      customerName: me.display_name || me.name || '고객',
    });
  } catch (err) {
    console.error('[subscribeBtn]', err);
    if (err.code !== 'USER_CANCEL') {
      alert('카드 등록 요청에 실패했어요: [' + (err.code || '코드없음') + '] ' + (err.message || err));
    }
  }
});

document.getElementById('saveAndRecommendBtn').addEventListener('click', async () => {
  const content = document.getElementById('prefInput').value.trim();
  const resultsWrap = document.getElementById('recommendResults');
  if (!content) { alert('취향을 입력해주세요'); return; }

  const btn = document.getElementById('saveAndRecommendBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const saveRes = await fetch('/api/payments/preferences', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
    body: JSON.stringify({ content }),
  });
  if (!saveRes.ok) { alert('저장에 실패했어요'); btn.disabled = false; btn.textContent = '취향 저장하고 추천받기'; return; }

  btn.textContent = 'AI가 골라주는 중...';
  resultsWrap.innerHTML = '<p class="empty">잠시만 기다려주세요...</p>';

  try {
    const recRes = await fetch('/api/payments/recommend', { method: 'POST', credentials: 'include' });
    const data = await recRes.json();
    if (!recRes.ok) throw new Error(data.error || '추천에 실패했어요');

    resultsWrap.innerHTML = data.recommendations.length
      ? data.recommendations.map(r => `
        <div class="rec-card">
          <h3>${escapeHtml(r.name)}</h3>
          <div style="font-size:12px;color:#8A8580;">${escapeHtml(r.address || '')}${r.category ? ' · ' + escapeHtml(r.category) : ''}</div>
          <div class="rec-reason">💡 ${escapeHtml(r.reason || '')}</div>
        </div>`).join('')
      : '<p class="empty">조건에 맞는 가게를 못 찾았어요.</p>';
  } catch (err) {
    resultsWrap.innerHTML = `<p class="empty">${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '취향 저장하고 추천받기';
  }
});

document.getElementById('cancelSubBtn').addEventListener('click', async () => {
  if (!confirm('구독을 해지할까요? 다음 결제부터 청구되지 않아요.')) return;
  const res = await fetch('/api/payments/subscribe/cancel', { method: 'POST', credentials: 'include' });
  if (res.ok) { alert('해지됐어요.'); checkSubscription(); }
});

async function initAuthArea() {
  const area = document.getElementById('authArea');
  try {
    const res = await fetch('/api/auth/profile', { credentials: 'include' });
    if (!res.ok) throw new Error();
    const profile = await res.json();
    const displayName = profile.display_name || profile.name || '익명';
    const avatarSrc = profile.avatar_url || profile.picture;
    area.innerHTML = `<a href="/profile.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:inherit;">
      ${avatarSrc ? `<img src="${avatarSrc}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #1C1917;" />` : `<span style="width:26px;height:26px;border-radius:50%;background:#D9A441;border:1.5px solid #1C1917;display:flex;align-items:center;justify-content:center;font-size:13px;">👤</span>`}
      <span style="font-size:13px;font-weight:700">${escapeHtml(displayName)}님</span></a>`;
  } catch {
    area.innerHTML = `<a class="btn-ghost" href="/login.html" style="text-decoration:none;">로그인</a>
      <a class="btn-primary" href="/signup.html" style="text-decoration:none;margin-left:6px;">회원가입</a>`;
  }
  area.style.visibility = 'visible';
}

async function init() {
  try {
    const res = await fetch('/api/payments/config');
    config = await res.json();
    console.log('[init] config:', config);
    tossPayments = TossPayments(config.billingClientKey);
    await initAuthArea();

    const meRes = await fetch('/api/auth/profile', { credentials: 'include' });
    if (!meRes.ok) {
      document.getElementById('subscribeCard').innerHTML = '<p class="empty">로그인 후 구독할 수 있어요. <a href="/login.html">로그인</a></p>';
      document.getElementById('subscribeCard').style.display = 'block';
      return;
    }
    checkSubscription();
  } catch (err) {
    console.error('[init] 실패:', err);
    document.getElementById('subscribeCard').innerHTML =
      '<p class="empty">초기화 실패: ' + escapeHtml(err.message || String(err)) + '</p>';
    document.getElementById('subscribeCard').style.display = 'block';
  }
}
init();
</script>
