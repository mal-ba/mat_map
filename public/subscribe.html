<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>찐맛집 - 맞춤추천 구독</title>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
    h2 { margin-bottom: 4px; }
    p.desc { color: #666; margin-top: 0; }
    .price { font-size: 28px; font-weight: bold; margin: 24px 0; color: #d9480f; }
    button {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold;
      background: #d9480f; color: white; border: none; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #b8390b; }
  </style>
</head>
<body>
  <h2>맞춤 추천</h2>
  <p class="desc">취향을 적어두면 AI가 딱 맞는 찐맛집을 골라드려요.</p>
  <div class="price">월 4,900원</div>
  <p class="desc">월 구독 · 언제든 해지 가능</p>
  <button id="subscribe-button">구독 시작하기</button>

  <script>
    // ⚠️ 발급받은 테스트 클라이언트 키
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";

    // 실제 서비스에서는 로그인한 유저의 고유 id로 교체하세요.
    // 예: const customerKey = window.CURRENT_USER_ID;
    const customerKey = "user_" + Math.random().toString(36).slice(2, 12);

    const tossPayments = TossPayments(clientKey);
    const payment = tossPayments.payment({ customerKey });

    document.getElementById("subscribe-button").addEventListener("click", async () => {
      try {
        // 결제 자체가 아니라 "카드 등록(빌링키 발급)"을 요청합니다.
        // 여기서는 실제로 돈이 빠져나가지 않고, 이후 서버가 이 카드로 매달 자동 청구합니다.
        await payment.requestBillingAuth({
          method: "CARD",
          successUrl: window.location.origin + "/billing/success",
          failUrl: window.location.origin + "/billing/fail",
          customerEmail: "test@example.com",
          customerName: "테스트 사용자",
        });
      } catch (err) {
        console.error(err);
        alert("구독 등록 중 오류가 발생했습니다: " + err.message);
      }
    });
  </script>
</body>
</html>
